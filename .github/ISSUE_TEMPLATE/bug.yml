name: Bug report
description: Report reproducible behavior that differs from the documented behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include Telegram sessions, API credentials, MCP tokens, bot tokens, passwords,
        private message content, or unredacted logs. Report vulnerabilities through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version, image tag, or commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Local uv installation
        - Docker Compose
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide a minimal sequence using redacted IDs and data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, client, and relevant non-secret configuration.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, session data, passwords, and private message content.
          required: true
        - label: This is not a security vulnerability.
          required: true
